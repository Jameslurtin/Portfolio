services:
  portfolio:
    build: .
    image: jameslurtin-portfolio:local
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 8080
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
